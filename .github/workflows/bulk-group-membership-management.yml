name: Entra ID Bulk Automation

on:
  workflow_dispatch:
    inputs:

      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - DEV
          - UAT
          - PRD

      operation:
        description: "Select Operation"
        required: true
        type: choice
        options:
          - Add Users to Group
          - Remove Users from Group
          - Add Devices to Group
          - Remove Devices from Group

      dry_run:
        description: "Execute in Dry Run mode?"
        required: true
        type: choice
        default: "Yes"
        options:
          - "Yes"
          - "No"

permissions:
  contents: read

jobs:

  bulk-automation:

    name: Entra ID Bulk Automation

    runs-on: ubuntu-latest

    timeout-minutes: 30

    environment: ${{ inputs.environment }}

    defaults:
      run:
        shell: pwsh

    env:
      CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      ENVIRONMENT: ${{ inputs.environment }}
      OPERATION: ${{ inputs.operation }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:

      #======================================================
      # 01 - Checkout Automation Repository
      #======================================================

      - name: Checkout Automation Repository
        uses: actions/checkout@v4

      #======================================================
      # 02 - Checkout CSV Data
      #
      # Automation code comes from main.
      # CSV data comes from csv-upload.
      #======================================================

      - name: Checkout CSV Data
        shell: bash
        run: |

          echo "Fetching csv-upload branch..."

          git fetch origin csv-upload

          echo "Checking out CSV directory..."

          git checkout FETCH_HEAD -- csv

          echo ""
          echo "CSV directory structure:"
          find csv -maxdepth 4 -type f | sort

      #======================================================
      # 03 - Display Workflow Inputs
      #======================================================

      - name: Display Workflow Inputs
        run: |

          Write-Host ""
          Write-Host "==========================================================="
          Write-Host " Entra ID Bulk Automation"
          Write-Host "==========================================================="
          Write-Host ""

          Write-Host ("{0,-25}: {1}" -f "Environment", $env:ENVIRONMENT)
          Write-Host ("{0,-25}: {1}" -f "Operation", $env:OPERATION)
          Write-Host ("{0,-25}: {1}" -f "Dry Run", $env:DRY_RUN)

          Write-Host ""

          Write-Host "==========================================================="
          Write-Host ""

      #======================================================
      # 04 - Validate Environment
      #======================================================

      - name: Validate Environment
        run: |

          Write-Host ""
          Write-Host "Validating environment..."
          Write-Host ""

          $ValidEnvironments = @(
              "DEV",
              "UAT",
              "PRD"
          )

          if ([string]::IsNullOrWhiteSpace($env:ENVIRONMENT))
          {
              throw "Environment was not selected."
          }

          if ($env:ENVIRONMENT -notin $ValidEnvironments)
          {
              throw "Invalid environment: $env:ENVIRONMENT"
          }

          Write-Host "✓ Environment is valid."
          Write-Host "  Environment: $env:ENVIRONMENT"

      #======================================================
      # 05 - Validate Operation
      #======================================================

      - name: Validate Operation
        run: |

          Write-Host ""
          Write-Host "Validating operation..."
          Write-Host ""

          $ValidOperations = @(
              "Add Users to Group",
              "Remove Users from Group",
              "Add Devices to Group",
              "Remove Devices from Group"
          )

          if ([string]::IsNullOrWhiteSpace($env:OPERATION))
          {
              throw "Operation was not selected."
          }

          if ($env:OPERATION -notin $ValidOperations)
          {
              throw "Invalid operation: $env:OPERATION"
          }

          Write-Host "✓ Operation is valid."
          Write-Host "  Operation: $env:OPERATION"

      #======================================================
      # 06 - Validate Dry Run
      #======================================================

      - name: Validate Dry Run
        run: |

          Write-Host ""
          Write-Host "Validating Dry Run option..."
          Write-Host ""

          if ($env:DRY_RUN -notin @(
              "Yes",
              "No"
          ))
          {
              throw "Invalid Dry Run value: $env:DRY_RUN"
          }

          Write-Host "✓ Dry Run option is valid."
          Write-Host "  Dry Run: $env:DRY_RUN"

      #======================================================
      # 07 - Determine Input Type
      #======================================================

      - name: Determine Input Type
        run: |

          switch ($env:OPERATION)
          {
              "Add Users to Group"
              {
                  $InputType = "Users"
              }

              "Remove Users from Group"
              {
                  $InputType = "Users"
              }

              "Add Devices to Group"
              {
                  $InputType = "Devices"
              }

              "Remove Devices from Group"
              {
                  $InputType = "Devices"
              }

              default
              {
                  throw "Unable to determine input type."
              }
          }

          "INPUT_TYPE=$InputType" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host ""
          Write-Host "Input Type: $InputType"

      #======================================================
      # 08 - Validate Environment Folder
      #======================================================
      - name: Validate Environment Folder
        run: |

          Write-Host ""
          Write-Host "==========================================================="
          Write-Host " Environment Folder Validation"
          Write-Host "==========================================================="
          Write-Host ""

          $Environment = $env:ENVIRONMENT.ToLower()

          $EnvironmentPath = "./csv/$Environment"
          $PendingPath = "$EnvironmentPath/pending"

          Write-Host "Selected Environment : $env:ENVIRONMENT"
          Write-Host "Filesystem Environment: $Environment"
          Write-Host "Environment Path     : $EnvironmentPath"
          Write-Host "Pending Path         : $PendingPath"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath $EnvironmentPath `
                  -PathType Container
          ))
          {
              throw "Environment folder does not exist: $EnvironmentPath"
          }

          if (-not (
              Test-Path `
                  -LiteralPath $PendingPath `
                  -PathType Container
          ))
          {
              throw "Pending folder does not exist: $PendingPath"
          }

          Write-Host "✓ Environment folder exists."
          Write-Host "✓ Pending folder exists."

      
      #======================================================
      # 09 - Determine Request File
      #======================================================

      - name: Determine Request File
        run: |

            $Environment = $env:ENVIRONMENT
            $EnvironmentFolder = $Environment.ToLower()
            $Operation = $env:OPERATION

            switch ($Operation)
            {
                "Add Users to Group"
                {
                    $ActionName = "add-users-to-groups"
                }

                "Remove Users from Group"
                {
                    $ActionName = "remove-users-from-groups"
                }

                "Add Devices to Group"
                {
                    $ActionName = "add-devices-to-groups"
                }

                "Remove Devices from Group"
                {
                    $ActionName = "remove-devices-from-groups"
                }

                default
                {
                    throw "Unsupported operation: $Operation"
                }
            }

            $RequestFile = "$EnvironmentFolder-$ActionName.csv"

            $CsvPath = "./csv/$EnvironmentFolder/pending/$RequestFile"

            "REQUEST_FILE=$RequestFile" |
                Out-File `
                    -FilePath $env:GITHUB_ENV `
                    -Encoding utf8 `
                    -Append

            "CSV_PATH=$CsvPath" |
                Out-File `
                    -FilePath $env:GITHUB_ENV `
                    -Encoding utf8 `
                    -Append

            Write-Host ""
            Write-Host "==========================================================="
            Write-Host " Request File"
            Write-Host "==========================================================="
            Write-Host ""

            Write-Host "Selected Environment : $Environment"
            Write-Host "Filesystem Folder    : $EnvironmentFolder"
            Write-Host "Operation            : $Operation"
            Write-Host "Request File         : $RequestFile"
            Write-Host "CSV Path             : $CsvPath"
              

      #======================================================
      # 10 - Validate Request File
      #======================================================

      - name: Validate Request File
        run: |

          Write-Host ""
          Write-Host "==========================================================="
          Write-Host " Request File Validation"
          Write-Host "==========================================================="
          Write-Host ""

          Write-Host "Environment : $env:ENVIRONMENT"
          Write-Host "Operation   : $env:OPERATION"
          Write-Host "Input Type  : $env:INPUT_TYPE"
          Write-Host "Request File: $env:REQUEST_FILE"
          Write-Host "CSV Path    : $env:CSV_PATH"
          Write-Host ""

          if (-not (
              Test-Path `
                  -LiteralPath $env:CSV_PATH `
                  -PathType Leaf
          ))
          {
              Write-Host "Expected request file was not found."
              Write-Host ""

              Write-Host "Available files in:"
              Write-Host "./csv/$env:ENVIRONMENT/Pending"
              Write-Host ""

                $EnvironmentFolder = $env:ENVIRONMENT.ToLower()

                Get-ChildItem `
                    -LiteralPath "./csv/$EnvironmentFolder/pending" `
                    -File |
                    Select-Object -ExpandProperty Name

              throw "Request file not found: $env:CSV_PATH"
          }

          $File = Get-Item `
              -LiteralPath $env:CSV_PATH

          Write-Host "✓ Request file found."
          Write-Host ""

          Write-Host ("File Name : {0}" -f $File.Name)
          Write-Host ("File Size : {0} bytes" -f $File.Length)

      #======================================================
      # 11 - Validate CSV Structure
      #======================================================

      - name: Validate CSV Structure
        run: |

          Write-Host ""
          Write-Host "==========================================================="
          Write-Host " CSV Structure Validation"
          Write-Host "==========================================================="
          Write-Host ""

          $Rows = @(
              Import-Csv `
                  -LiteralPath $env:CSV_PATH
          )

          if ($Rows.Count -eq 0)
          {
              throw "CSV file contains no records."
          }

          $Columns = @(
              $Rows[0].PSObject.Properties.Name
          )

          Write-Host "Input Type: $env:INPUT_TYPE"
          Write-Host ""

          Write-Host "Columns detected:"
          foreach ($Column in $Columns)
          {
              Write-Host " - $Column"
          }

          Write-Host ""

          if ($env:INPUT_TYPE -eq "Users")
          {
              $RequiredColumns = @(
                  "email",
                  "group_name"
              )
          }
          else
          {
              $RequiredColumns = @(
                  "device_name",
                  "group_name"
              )
          }

          foreach ($Column in $RequiredColumns)
          {
              if ($Column -notin $Columns)
              {
                  throw "Required column '$Column' is missing."
              }
          }

          Write-Host "✓ CSV structure validated."
          Write-Host "Records Found: $($Rows.Count)"

      #======================================================
      # 12 - Install Microsoft Graph Modules
      #======================================================

      - name: Install Microsoft Graph PowerShell Modules
        run: |

          Write-Host ""
          Write-Host "Installing Microsoft Graph PowerShell modules..."
          Write-Host ""

          Set-PSRepository `
              PSGallery `
              -InstallationPolicy Trusted

          Install-Module `
              Microsoft.Graph.Authentication `
              -Scope CurrentUser `
              -Force

          Install-Module `
              Microsoft.Graph.Users `
              -Scope CurrentUser `
              -Force

          Install-Module `
              Microsoft.Graph.Groups `
              -Scope CurrentUser `
              -Force

          Install-Module `
              Microsoft.Graph.Identity.DirectoryManagement `
              -Scope CurrentUser `
              -Force

          Write-Host ""
          Write-Host "✓ Microsoft Graph modules installed."

      #======================================================
      # 13 - Display Graph SDK Information
      #======================================================

      - name: Display Graph SDK Information
        run: |

          Write-Host ""
          Write-Host "==========================================================="
          Write-Host " Microsoft Graph SDK"
          Write-Host "==========================================================="
          Write-Host ""

          Write-Host "Authentication Module:"
          Get-InstalledModule `
              Microsoft.Graph.Authentication

          Write-Host ""
          Write-Host "Connect-MgGraph:"
          Get-Command Connect-MgGraph

          Write-Host ""
          Write-Host "Graph Modules:"
          Get-Module `
              -ListAvailable `
              Microsoft.Graph.Users,
              Microsoft.Graph.Groups,
              Microsoft.Graph.Identity.DirectoryManagement |
              Select-Object Name, Version

      #======================================================
      # 14 - Verify Required Cmdlets
      #======================================================

      - name: Verify Required Cmdlets
        run: |

          Write-Host ""
          Write-Host "Checking required Graph cmdlets..."
          Write-Host ""

          $RequiredCmdlets = @(
              "Connect-MgGraph",
              "Get-MgUser",
              "Get-MgGroup",
              "Get-MgDevice",
              "Get-MgGroupMember"
          )

          foreach ($Cmdlet in $RequiredCmdlets)
          {
              if (Get-Command `
                  $Cmdlet `
                  -ErrorAction SilentlyContinue)
              {
                  Write-Host "✓ $Cmdlet"
              }
              else
              {
                  Write-Host "⚠ $Cmdlet not available"
              }
          }

          Write-Host ""

      #======================================================
      # 15 - Display Request Preview
      #======================================================

      - name: Display Request Preview
        run: |

          Write-Host ""
          Write-Host "==========================================================="
          Write-Host " Request Preview"
          Write-Host "==========================================================="
          Write-Host ""

          Write-Host "Environment : $env:ENVIRONMENT"
          Write-Host "Operation   : $env:OPERATION"
          Write-Host "Input Type  : $env:INPUT_TYPE"
          Write-Host "Request File: $env:REQUEST_FILE"
          Write-Host "Dry Run     : $env:DRY_RUN"
          Write-Host ""

          Import-Csv `
              -LiteralPath $env:CSV_PATH |
              Select-Object -First 5 |
              Format-Table -AutoSize

          Write-Host ""
          Write-Host "Preview limited to first 5 records."

      #======================================================
      # 16 - Execute Automation
      #======================================================

      - name: Execute Automation
        run: |

          Write-Host ""
          Write-Host "==========================================================="
          Write-Host " Starting Automation"
          Write-Host "==========================================================="
          Write-Host ""

          Write-Host "Environment : $env:ENVIRONMENT"
          Write-Host "Operation   : $env:OPERATION"
          Write-Host "Input Type  : $env:INPUT_TYPE"
          Write-Host "Request File: $env:REQUEST_FILE"
          Write-Host "CSV Path    : $env:CSV_PATH"
          Write-Host "Dry Run     : $env:DRY_RUN"
          Write-Host ""

          ./scripts/main.ps1 `
              -Operation "$env:OPERATION" `
              -CsvPath "$env:CSV_PATH" `
              -DryRun "$env:DRY_RUN"

      #======================================================
      # 17 - Generate Job Summary
      #======================================================

      - name: Generate Job Summary
        if: always()
        run: |

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "# Entra ID Bulk Automation"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              ""

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "| Item | Value |"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "|------|-------|"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "| Environment | $env:ENVIRONMENT |"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "| Operation | $env:OPERATION |"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "| Input Type | $env:INPUT_TYPE |"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "| Request File | $env:REQUEST_FILE |"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "| Dry Run | $env:DRY_RUN |"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "| Triggered By | $env:GITHUB_ACTOR |"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "| Run Number | $env:GITHUB_RUN_NUMBER |"

      #======================================================
      # 18 - Upload Logs
      #======================================================

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30